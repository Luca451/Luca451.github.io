<!-- 
     BACKGROUND ANIMATION
 -->


<script>


const background =
document.querySelector(".background-layer");



let mouseX = 0;

let mouseY = 0;





document.addEventListener(
    "mousemove",
    (event)=>{


        mouseX =
        (event.clientX / window.innerWidth - 0.5) * 35;



        mouseY =
        (event.clientY / window.innerHeight - 0.5) * 35;


    }
);






function animateBackground(){



    background.style.transform =


    `
        translate(${-mouseX}px, ${-mouseY}px)
        scale(1.1)
    `;



    requestAnimationFrame(
        animateBackground
    );


}



animateBackground();



</script>









<!-- 
     PAGE TRANSITION
 -->


<script>


const page =
document.querySelector(".page");



const links =
document.querySelectorAll("nav a");





links.forEach(link => {



    link.addEventListener(
        "click",
        event => {



            const target =
            link.getAttribute("href");



            if(
                target &&
                target.endsWith(".html") &&
                !link.classList.contains("active")
            ){


                event.preventDefault();



                page.classList.add(
                    "page-leave"
                );




                setTimeout(()=>{


                    window.location.href =
                    target;



                },500);


            }


        }
    );


});



</script>

/* language-switch */ 
<script>
(function () {

    const STORAGE_KEY = "3mi-language";

    const buttons = document.querySelectorAll("[data-language]");

    function applyLanguage(lang) {

        const language = lang === "en" ? "en" : "de";

        document.documentElement.lang = language;

        localStorage.setItem(STORAGE_KEY, language);

        document
            .querySelectorAll("[data-de][data-en]")
            .forEach(function (element) {

                element.innerHTML =
                    element.getAttribute("data-" + language);

            });

        const title =
            document.querySelector("title[data-de][data-en]");

        if (title) {
            title.textContent =
                title.getAttribute("data-" + language);
        }

        buttons.forEach(function (button) {

            const active =
                button.dataset.language === language;

            button.classList.toggle("active", active);

            button.setAttribute(
                "aria-pressed",
                active ? "true" : "false"
            );

        });
    }

    buttons.forEach(function (button) {

        button.addEventListener("click", function () {
            applyLanguage(button.dataset.language);
        });

    });

    applyLanguage(
        localStorage.getItem(STORAGE_KEY) || "de"
    );

})();
</script>
