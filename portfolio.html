<!-- 
     PAGE TRANSITION
 -->

<script>

const transitionPage = document.querySelector(".page");
const transitionLinks = document.querySelectorAll("nav a");

transitionLinks.forEach((transitionLink) => {

  transitionLink.addEventListener("click", (event) => {

    const targetPage = transitionLink.getAttribute("href");

    if (
      targetPage &&
      targetPage.endsWith(".html") &&
      !transitionLink.classList.contains("active")
    ) {

      event.preventDefault();

      transitionPage.classList.add("page-leave");

      setTimeout(() => {
        window.location.href = targetPage;
      }, 500);

    }

  });

});

</script>
